<!-- INICIA TABLA -->
<div class="">
  <!-- Button trigger modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
    Registrar animal
  </button>
</div>

<div class="table-responsive">
  <table class="table table-striped table-sm">

    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Edad</th>
        <th scope="col">Tipo</th>
        <th scope="col">Editar</th>
        <th scope="col">Eliminar</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let item of animalList">
        <td>{{ item.nombre }}</td>
        <td>{{ item.edad }}</td>
        <td>{{ item.tipo }}</td>
         <td>
            <button type="button" class="btn btn-primary" (click)="toggleEditAnimal(item._id)">
              <i class="bi bi-pencil-square"></i>
              </button>
              </td>

         <td>
                              <button type="button" class="btn btn-primary" (click)="deleteAnimalEntry(item._id)">
                                    <i class="bi bi-trash"></i>
                                </button>
                          </td>

      </tr>

    </tbody>

  </table>
</div>

<!-- TERMINA TABLA -->





<!-- Modal New Animal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">

        <h1 class="modal-title fs-5" id="exampleModalLabel">
          Nuevo animal
        </h1>

        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

      </div>

      <div class="modal-body">

        <form class="card p-2" (ngSubmit)="newAnimalEntry()" [formGroup]="animalForm">

          <div class="mb-3">

            <label for="nombre" class="form-label">
              Nombre
            </label>

            <input type="text" class="form-control" id="nombre" placeholder="Nombre del animal"
              formControlName="nombre">

          </div>

          <div class="mb-3">

            <label for="edad" class="form-label">
              Edad
            </label>

            <input type="number" class="form-control" id="edad" placeholder="Edad animal" formControlName="edad">

          </div>

          <div class="mb-3">

            <label for="tipo" class="form-label">
              Tipo
            </label>

            <input type="text" class="form-control" id="tipo" placeholder="Tipo de animal" formControlName="tipo">

          </div>

          <div class="input-group justify-content-center md-12">

            <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">
              Guardar
            </button>

          </div>

        </form>

      </div>

      <div class="modal-footer">

        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cerrar
        </button>

      </div>

    </div>

  </div>

</div>

<form *ngIf="editableAnimal" class="card p-3 mt-3" (ngSubmit)="updateAnimalEntry()" [formGroup]="animalForm">

  <h4 class="mb-3">
    Editar animal
  </h4>

  <div class="mb-3">

    <label for="editNombre" class="form-label">
      Nombre
    </label>

    <input type="text" class="form-control" id="editNombre" placeholder="Nombre del animal" formControlName="nombre">

  </div>

  <div class="mb-3">

    <label for="editEdad" class="form-label">
      Edad
    </label>

    <input type="number" class="form-control" id="editEdad" placeholder="Edad animal" formControlName="edad">

  </div>

  <div class="mb-3">

    <label for="editTipo" class="form-label">
      Tipo
    </label>

    <input type="text" class="form-control" id="editTipo" placeholder="Tipo de animal" formControlName="tipo">

  </div>

  <div class="d-flex gap-2 justify-content-center">

    <button type="submit" class="btn btn-success">

      Actualizar

    </button>

    <button type="button" class="btn btn-secondary" (click)="editableAnimal = null">

      Cancelar

    </button>

  </div>

</form>
